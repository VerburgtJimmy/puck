name: bench-linux

on:
  workflow_dispatch:
  schedule:
    # Sunday 06:00 UTC — warm-wipe / size / RSS pack for Fable v0.1.0
    - cron: "0 6 * * 0"
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  PUCK_NOTES_BENCHMARKS: ${{ github.workspace }}/bench-out/benchmarks.md

jobs:
  linux-benches:
    name: linux benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Install PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none

      - name: Build release puck
        run: cargo build --release -p puck_cli

      - name: Prepare bench-out
        run: mkdir -p bench-out

      - name: Binary size
        run: ./benches/binary-size.sh | tee bench-out/binary-size.log

      - name: Install timing (laravel-skeleton)
        env:
          PUCK_TIMINGS: "1"
        run: ./benches/install-timing.sh laravel-skeleton | tee bench-out/install-timing-skeleton.log

      - name: Resource usage (laravel-skeleton)
        run: ./benches/resource-usage.sh laravel-skeleton | tee bench-out/resource-usage-skeleton.log

      - name: Install timing (laravel-app with require-dev)
        env:
          PUCK_BENCH_DEV: "1"
          PUCK_TIMINGS: "1"
        run: ./benches/install-timing.sh laravel-app with-dev | tee bench-out/install-timing-laravel-app-dev.log

      - name: Resource usage (laravel-app with require-dev)
        env:
          PUCK_BENCH_DEV: "1"
        run: ./benches/resource-usage.sh laravel-app with-dev | tee bench-out/resource-usage-laravel-app-dev.log

      - name: Cold/warm gate vs Composer
        run: |
          chmod +x benches/cold-gate.sh
          ./benches/cold-gate.sh \
            bench-out/install-timing-skeleton.log \
            bench-out/install-timing-laravel-app-dev.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-benches
          path: |
            bench-out/benchmarks.md
            bench-out/*.log
          if-no-files-found: warn

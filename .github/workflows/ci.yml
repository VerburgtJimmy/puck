name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  parity:
    name: parity
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          coverage: none
      - name: Build puck (release)
        run: cargo build --release -p puck_cli
      - name: Parity laravel-skeleton --no-dev --puck-lock
        env:
          PUCK_BIN: ${{ github.workspace }}/target/release/puck
          PUCK_REGISTRY: ${{ github.workspace }}/fixtures/registry
        run: ./parity/run.sh laravel-skeleton --no-dev --puck-lock
      - name: Parity laravel-app --no-dev --puck-lock
        env:
          PUCK_BIN: ${{ github.workspace }}/target/release/puck
          PUCK_REGISTRY: ${{ github.workspace }}/fixtures/registry
        run: ./parity/run.sh laravel-app --no-dev --puck-lock
